spring:
  application:
    name: TuKu
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    url: jdbc:mysql://127.0.0.1:3306/yuxi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
  profiles:
    active: local
server:
  port: 8080
  servlet:
    context-path: /api

